name: X Auto Post

on:
  schedule:
    - cron: '0 23 * * *'   # 08:00 JST (UTC+9)
    - cron: '0 12 * * *'   # 21:00 JST (UTC+9)
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/twitter/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Post to X (GIF preferred, text fallback)
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET:      ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          APP_URL:               ${{ secrets.APP_URL }}
          DEMO_EMAIL:            ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD:         ${{ secrets.DEMO_PASSWORD }}
        run: |
          cd scripts/twitter
          python gif_post.py || python post.py

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: scripts/twitter/debug_screenshot.png
          if-no-files-found: ignore

      - name: Commit post history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: update twitter post history'
          file_pattern: 'scripts/twitter/posted_history.json'
