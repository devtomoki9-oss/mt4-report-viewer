name: Generate Post Templates

on:
  push:
    branches: [master]
    paths-ignore:
      - 'scripts/**'
      - '.github/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate templates from commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_COMMIT: ${{ github.sha }}
        run: python scripts/generate_posts.py

      - name: Commit generated templates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: add generated post templates'
          file_pattern: 'scripts/twitter/posts.py scripts/qiita/articles.py'
